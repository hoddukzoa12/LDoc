<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>LDoc</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: "Noto Sans CJK KR", sans-serif; }
      body { display: flex; flex-direction: column; background: #eef0f3; }
      #bar { display: flex; gap: 16px; align-items: center; padding: 8px 16px; background: #fff; border-bottom: 1px solid #d0d4da; font-size: 14px; }
      #today { margin-left: auto; color: #6b7280; }
      #host { --page-pad: 72px; --gutter: 190px; flex: 1; min-height: 0; overflow: auto; position: relative; padding: 24px var(--gutter) 80px; }
      #open { position: fixed; right: 24px; bottom: 24px; z-index: 5; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-size: 13px; }
      #open[hidden] { display: none; }
      #open-list { display: none; width: 256px; max-height: min(60vh, 520px); overflow: auto; box-sizing: border-box; padding: 10px 12px; background: #fff; border: 1px solid #d0d4da; border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); }
      #open:hover #open-list:not(:empty), #open.pinned #open-list:not(:empty) { display: block; }
      #open-toggle { padding: 6px 14px; border-radius: 16px; border: 1px solid #d0d4da; background: #fff; color: #1f2937; font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); }
      #open-toggle:hover, #open.pinned #open-toggle { filter: brightness(0.95); }
      #open-toggle.warn { color: #b45309; border-color: #f5c26b; background: #fff7e6; }
      #open-toggle.done { color: #166534; border-color: #86d1a3; background: #eefbf3; }
      #open .muted { margin: 0 0 8px; color: #6b7280; }
      #open ol { list-style: none; margin: 0; padding: 0; }
      #open li { display: grid; grid-template-columns: 44px 1fr; gap: 0 6px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
      #open li:hover { background: #f3f4f6; }
      #open .where { color: #6b7280; grid-row: span 2; }
      #open .label { font-weight: 600; color: #1f2937; }
      #open .state { color: #6b7280; }
      #open .state.bad { color: #b45309; }
      #open .state.offer { color: #2563eb; }
      #open li.cond .label, #open li.cond .state, #open li.cond .where { color: #b0b5bb; font-weight: 400; }
      #banner { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); z-index: 10; padding: 10px 18px; border-radius: 8px; background: #1f2937; color: #fff; font-size: 15px; box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: 900px; }
      #banner.ok { background: #166534; }
      #banner.bad { background: #991b1b; }

      .ProseMirror {
        width: 794px; min-height: 1123px; box-sizing: border-box; margin: 0 auto; padding: var(--page-pad);
        background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15); outline: none;
        font-family: "Noto Serif CJK KR", serif; font-size: 15px; line-height: 1.65; color: #111827;
      }
      .ProseMirror p { margin: 0; position: relative; }
      .hint-placeholder::before { content: attr(data-hint); position: absolute; left: 0; color: #a3a8ae; pointer-events: none; }
      .hint-label::after { content: attr(data-hint); margin-left: 10px; padding: 1px 6px; border-radius: 4px; background: #f3f4f6; color: #6b7280; font-family: "Noto Sans CJK KR", sans-serif; font-size: 12px; pointer-events: none; }
      .indent-1 { padding-left: 1.2em; }
      .indent-2 { padding-left: 2.4em; }
      .indent-3 { padding-left: 3.6em; }
      .role-title { text-align: center; font-size: 22px; font-weight: 700; letter-spacing: 0.1em; margin: 0 0 18px !important; }
      .role-heading { font-weight: 700; margin-top: 12px !important; }
      .role-preamble { margin-bottom: 8px !important; }
      .role-closing { margin-top: 6px !important; }

      /* blanks */
      .blank { border-radius: 4px; }
      .filled { background: #eef4ff; border-bottom: 1.5px solid #93b4f5; padding: 0 1px; }
      .filled.computed { background: #eefbf3; border-bottom-color: #86d1a3; }
      .filled.unread { background: #fff4e0; border-bottom: 2px dashed #d97706; }
      .filled.pending { background: #eef4ff; border-bottom: 2px dotted #2563eb; }
      .wait { margin-left: 4px; padding: 0 5px; border-radius: 4px; background: #e0ecff; color: #1d4ed8; font-family: "Noto Sans CJK KR", sans-serif; font-size: 11px; user-select: none; -webkit-user-select: none; }
      .is-focus { outline: 2px solid #2563eb; outline-offset: 1px; border-radius: 3px; }
      .ph { display: inline-block; padding: 0 6px; margin: 0 1px; border-radius: 4px; background: #f1f3f5; border: 1px dashed #9aa0a6; color: #6b7280; font-family: "Noto Sans CJK KR", sans-serif; font-size: 13px; line-height: 1.5; cursor: text; user-select: none; -webkit-user-select: none; }
      .ph.focused { border: 1.5px solid #2563eb; background: #fff; }
      .ph.suggest { color: #9aa0a6; font-style: italic; background: #fff; }
      .ph small { margin-left: 6px; font-style: normal; font-size: 11px; color: #2563eb; }
      .preview { margin-left: 6px; font-family: "Noto Sans CJK KR", sans-serif; font-size: 12px; color: #2563eb; user-select: none; -webkit-user-select: none; }
      .badge { margin-left: 4px; padding: 0 5px; border-radius: 4px; background: #fde68a; color: #92400e; font-family: "Noto Sans CJK KR", sans-serif; font-size: 11px; user-select: none; -webkit-user-select: none; }

      /* undecided branches */
      .tentative { background: repeating-linear-gradient(135deg, #fffaf0, #fffaf0 6px, #fff5e1 6px, #fff5e1 12px); border-left: 3px dashed #f59e0b; color: #6b5a3a; }
      .tentative-inline { background: #fff3d6; border-bottom: 1px dashed #f59e0b; color: #6b5a3a; }
      .tag { display: inline-block; margin-right: 4px; padding: 0 6px; border-radius: 10px; background: #fde7b0; color: #8a5a00; font-family: "Noto Sans CJK KR", sans-serif; font-size: 12px; line-height: 1.5; cursor: pointer; }
      .tag:hover { background: #fbd77a; }
      .bar.undecided { margin: 8px 0 2px !important; padding: 4px 8px; border-radius: 6px; background: #fff7e6; border: 1px solid #f5c26b; font-family: "Noto Sans CJK KR", sans-serif; font-size: 13px; }
      .bar-controls b { margin-right: 10px; color: #8a5a00; }
      .opt { display: inline-block; margin-right: 6px; padding: 0 8px; border-radius: 12px; border: 1px solid #d4a64a; background: #fff; color: #5c3d00; cursor: pointer; }
      .opt.current { background: #1f2937; color: #fff; border-color: #1f2937; }
      .intent { color: #374151; }
      .intent-hint { color: #b8a27a; font-size: 12px; user-select: none; -webkit-user-select: none; }
      .intent-reading { margin-left: 8px; padding: 0 8px; border-radius: 6px; background: #eef2ff; color: #6b7280; font-style: italic; }
      .intent-reading small { margin-left: 8px; font-style: normal; color: #7c3aed; }
      .intent-none { margin-left: 8px; color: #9aa0a6; font-size: 12px; }
      .bar.decided { height: 0; margin: 0 !important; overflow: visible; }
      .chip { position: absolute; right: calc(100% + var(--page-pad) + 12px); top: 3px; max-width: calc(var(--gutter) - 24px); box-sizing: border-box; padding: 1px 6px; border-radius: 6px; background: #f3f4f6; border: 1px solid #d1d5db; color: #374151; font-family: "Noto Sans CJK KR", sans-serif; font-size: 10.5px; line-height: 1.4; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2; }
      .chip:hover { background: #e5e7eb; }
      .ref.flash, .flash { background: #fde047; transition: background 0.3s; border-radius: 3px; }

      /* the ghost skeleton before Tab */
      .skeleton { display: block; color: #a3a8ae; }
      .skeleton .ghost-line { display: block; }
      .skeleton .ph { color: #a3a8ae; border-color: #c4c8cc; background: #f8f9fa; }
      .skeleton .tag { background: #f3ead3; color: #b3a17a; }
      .skeleton .tentative-inline { background: #fbf6ea; color: #b8ab8e; }
      .skeleton .tentative { color: #b8ab8e; }
      .skeleton .bar.undecided { color: #b8a27a; background: #fdfaf2; border-color: #efdcb3; }
      .skeleton .role-title { color: #a3a8ae; }
    </style>
  </head>
  <body>
    <header id="bar">
      <strong>LDoc</strong>
      <span>가이드 doc-037 근로계약서 · 모델 없음</span>
      <span id="today"></span>
    </header>
    <div id="banner" hidden></div>
    <main id="host"></main>
    <aside id="open" hidden>
      <div id="open-list"></div>
      <button id="open-toggle" type="button" aria-expanded="false"></button>
    </aside>
    <script>
      window.spikeErrors = [];
      window.addEventListener("error", (e) => window.spikeErrors.push(e.message + "\n" + String(e.error?.stack ?? "")));
      window.addEventListener("unhandledrejection", (e) => window.spikeErrors.push(String(e.reason) + "\n" + String(e.reason?.stack ?? "")));
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
